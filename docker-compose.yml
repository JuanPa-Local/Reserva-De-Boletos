# docker-compose.yml - Contenedor PostgreSQL para el SRB
#
# IMPORTANTE:
# Ejecutar siempre con:
#   docker compose --env-file config.env up -d
#
# Explicacion:
# Las variables ${DB_USER}, ${DB_PASSWORD}, ${DB_NAME} y ${PUERTO_POSTGRES} se interpolan
# por docker compose a nivel de definicion del servicio (ports, environment). Si no se usa
# --env-file config.env, docker compose no las resuelve desde env_file y recurre a valores
# por defecto o vacios.
#
# Carga automatica del esquema:
# El volumen monta schema_demo.sql en /docker-entrypoint-initdb.d/01-schema_demo.sql,
# lo que permite la inicializacion automatica de las tablas y eventos de prueba (E1 y E2)
# cuando se crea el volumen de la base de datos por primera vez.

services:
  postgres:
    image: postgres:16
    container_name: srb_postgres
    restart: unless-stopped
    env_file:
      - config.env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-srb}
    ports:
      - "${PUERTO_POSTGRES:-5434}:5432"
    volumes:
      - ./schema_demo.sql:/docker-entrypoint-initdb.d/01-schema_demo.sql:ro,z
